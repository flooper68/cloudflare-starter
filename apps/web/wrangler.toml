name = "cloudflare-starter-web"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
APP_ENV = "develop"

[[queues.producers]]
binding = "APP_QUEUE"
queue = "cloudflare-starter-develop"

[env.staging.vars]
APP_ENV = "staging"

[[env.staging.queues.producers]]
binding = "APP_QUEUE"
queue = "cloudflare-starter-staging"

[env.production.vars]
APP_ENV = "production"

[[env.production.queues.producers]]
binding = "APP_QUEUE"
queue = "cloudflare-starter-production"
