<svg xmlns="http://www.w3.org/2000/svg" class="dg-mm" viewBox="0 0 1785.3059999999996 366.70000000000005" width="1786" height="367" role="img" data-natural-width="">
<title>Data export and account erasure</title>
<desc>Export. privacy.requestExport checks the limits and authorization, writes a data_requests row and enqueues privacy.build-export. The job reads D1 in pages and the user's R2 objects, streams them through the Zip port into a multipart upload in R2, checks authorization again, and notifies the user. The download route needs a signed, expiring link and the signed-in user. The hourly privacy.purge-exports removes expired archives. Erasure. Self-deletion through Better Auth and admin erasure share one pipeline: preflight refuses the last owner or last admin and takes the erasure lock, the owning features erase workspace and user artifacts in R2 and redact the audit subject, Better Auth deletes the user, whose rows cascade, and the after hook writes an erasure record, schedules delayed storage sweeps, records the audit event and sends a confirmation.</desc>
