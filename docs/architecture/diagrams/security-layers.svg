<text x="210.65699999999993" y="143.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">edge rate limits: route policies, every mutation</text>
</g>
<g class="node" data-id="Human" data-label="Turnstile: sign-up, sign-in, password reset" data-shape="rectangle">
<rect x="67.41699999999992" y="209.8" width="286.48" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="210.65699999999993" y="228.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">Turnstile: sign-up, sign-in, password reset</text>
</g>
