<polyline class="edge" data-from="Limits" data-to="Human" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.65699999999993,161.8 210.65699999999993,209.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#dg-security-layers-arrowhead)" />
<polyline class="edge" data-from="Human" data-to="Auth" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.65699999999993,246.70000000000002 210.65699999999993,294.70000000000005" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#dg-security-layers-arrowhead)" />
<polyline class="edge" data-from="Auth" data-to="Actor" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.65699999999993,331.6 210.65699999999993,379.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#dg-security-layers-arrowhead)" />
<polyline class="edge" data-from="Actor" data-to="Permission" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.65699999999993,416.5 210.65699999999993,464.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#dg-security-layers-arrowhead)" />
