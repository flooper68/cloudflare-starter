<rect x="40" y="294.70000000000005" width="341.31399999999985" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="210.65699999999993" y="313.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">session or MCP token, security state, second factor</text>
</g>
