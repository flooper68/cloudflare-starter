<rect x="77.79099999999994" y="379.6" width="265.73199999999997" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="210.65699999999993" y="398.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">workspace membership: resolveActor</text>
</g>
<g class="node" data-id="Permission" data-label="permission: requirePermission, can" data-shape="rectangle">
<rect x="85.20099999999995" y="464.5" width="250.91199999999995" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="210.65699999999993" y="482.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">permission: requirePermission, can</text>
</g>
<g class="node" data-id="Entitlement" data-label="plan: requireFeature, requireLimit" data-shape="rectangle">
<rect x="90.38799999999996" y="549.4" width="240.53799999999993" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="210.65699999999993" y="567.85" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">plan: requireFeature, requireLimit</text>
</g>
<g class="node" data-id="Audit" data-label="use case and audit event" data-shape="rectangle">
<rect x="117.80499999999994" y="634.3" width="185.70399999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
<text x="210.65699999999993" y="652.75" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">use case and audit event</text>
