<svg xmlns="http://www.w3.org/2000/svg" class="dg-mm" viewBox="0 0 849.7945 630" width="850" height="630" role="img" data-natural-width="">
<title>Sign-up, verification, workspace and dashboard</title>
<desc>The sign-up form posts to /api/auth/sign-up/email with a Turnstile token. The route counts the request per IP (auth.ip), then Better Auth's before hook verifies the token with Turnstile Siteverify and applies Better Auth's own limit, stored in D1. The user.create.before hook checks the sign-up policy. Better Auth inserts the user. The user.create.after hook provisions the workspace (a personal workspace, or membership of the single workspace), starts the plan's trial, records the audit events and tracks auth.signed_up. Better Auth sends the verification mail through Email Sending. With verification required there is no session yet and the form shows check your inbox. The link verifies the address, signs the user in and lands on /email-verified, which continues to /app. The dashboard's tRPC queries resolve the actor; resolveActor provisions the workspace again if the sign-up hook failed.</desc>
