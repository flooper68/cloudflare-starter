<svg xmlns="http://www.w3.org/2000/svg" class="dg-mm" viewBox="0 0 1092.541 783" width="1093" height="783" role="img" data-natural-width="">
<title>A background job, from enqueue to the dead-letter queue</title>
<desc>A use case calls enqueueJob, which validates the payload and sends a CloudEvents envelope, carrying the caller's traceparent, user, workspace and an optional idempotency key, through the JobQueue port to APP_QUEUE. The queue delivers batches to the Worker's queue handler. For each message the consumer parses the envelope, continues the producer's trace and, if the job has an idempotency key, claims it in D1; a key already done is acked as skipped. It runs the handler, a use case. Success marks the key done and acks. A transient failure releases the claim and retries with the job's backoff. A permanent failure is reported and acked. A failure on the final attempt is reported and moved to the dead-letter queue, which has no consumer and keeps messages 14 days.</desc>
