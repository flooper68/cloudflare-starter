<svg xmlns="http://www.w3.org/2000/svg" class="dg-mm" viewBox="0 0 1364.8124523809522 1272.4" width="1365" height="1273" role="img" data-natural-width="">
<title>The Notes feature across the layers</title>
<desc>In packages/ui, the NoteList and NoteEditor components. In the SPA, NotesPage and NoteDetailPage render them, are routed in routes.tsx and listed in navigation.ts and the command palette, and call the notes tRPC procedures. On the server, notesRouter holds workspace procedures and the MCP tools list_notes, create_note and the others call the same procedures in process. Each procedure calls one use case in packages/features/src/notes, such as createNote. The use cases apply the pure rules in notes/domain, ask the workspaces feature for the permission, billing for the notes limit, record audit events and track product events, and read and write the notes and note_comments tables in D1. The composition roots register the feature: database.ts its tables, trash-catalog.ts its trash entity, analytics-events.ts its event, data-catalog.ts its export and erasure, and billing's measure-metric.ts its countWorkspaceNotes measure.</desc>
