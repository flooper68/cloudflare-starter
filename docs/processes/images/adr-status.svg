<polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
</marker>
</defs>
<polyline class="edge" data-from="_start" data-to="Proposed" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="251.05300000000005,68 251.05300000000005,116" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#dg-adr-status-arrowhead)" />
<polyline class="edge" data-from="Proposed" data-to="Accepted" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="owner accepts" points="234.18133333333338,152.9 234.18133333333338,188.9 175.97900000000004,188.9 175.97900000000004,273.65000000000003" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#dg-adr-status-arrowhead)" />
