name: Deploy

# Manual deploy of the web app to one environment: Actions → Deploy → Run workflow.
# Secrets come from the GitHub environment of the same name, so its protection rules
# (required reviewers, allowed branches) apply. See docs/guides/how-to-setup-ci.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        default: develop
        options:
          - develop
          - staging
          - production

permissions:
  contents: read

# One deploy per environment at a time; a second one waits instead of cancelling a
# deploy halfway through.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - run: bun run verify

      # develop is Wrangler's top-level environment (no --env flag).
      - name: Apply D1 migrations (remote)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$DEPLOY_ENV" = "develop" ]; then
            bunx wrangler d1 migrations apply DB --remote
          else
            bunx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
          fi

      # deploy / deploy:staging / deploy:production pick the environment at build time.
      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$DEPLOY_ENV" = "develop" ]; then
            bun run deploy
          else
            bun run "deploy:$DEPLOY_ENV"
          fi

  # The production smoke suite against what was just deployed: GET requests only, no
  # sign-up, no writes (apps/web/test/e2e/smoke). The URL is the environment's route in
  # wrangler.jsonc, or the optional repository variable APP_URL; without either (develop
  # on workers.dev) the step warns and passes. No secrets and no GitHub environment, so it
  # needs no second approval. docs/guides/how-to-qa-a-deployment.md.
  smoke:
    name: Smoke ${{ inputs.environment }}
    needs: deploy
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      E2E_BASE_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-playwright-install.ts
      - name: Smoke suite
        timeout-minutes: 10
        run: bun run test:smoke -- --env "$DEPLOY_ENV"
      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report-${{ inputs.environment }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
