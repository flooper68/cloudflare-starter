name: Deploy

# Manual deploy of the web app to one environment: Actions → Deploy → Run workflow.
# Secrets come from the GitHub environment of the same name, so its protection rules
# (required reviewers, allowed branches) apply. See docs/how-to-setup-ci.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        default: develop
        options:
          - develop
          - staging
          - production

permissions:
  contents: read

# One deploy per environment at a time; a second one waits instead of cancelling a
# deploy halfway through.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - run: bun run verify

      # develop is Wrangler's top-level environment (no --env flag).
      - name: Apply D1 migrations (remote)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$DEPLOY_ENV" = "develop" ]; then
            bunx wrangler d1 migrations apply DB --remote
          else
            bunx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
          fi

      # deploy / deploy:staging / deploy:production pick the environment at build time.
      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$DEPLOY_ENV" = "develop" ]; then
            bun run deploy
          else
            bun run "deploy:$DEPLOY_ENV"
          fi
