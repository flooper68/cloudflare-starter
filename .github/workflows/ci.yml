name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner choice (every job): the repository variable CI_RUNS_ON, as JSON, e.g.
#   gh variable set CI_RUNS_ON --body '["self-hosted","cloudflare-starter"]'
# Unset means "ubuntu-latest". Pull requests from forks ALWAYS run on GitHub-hosted
# runners: the repository is public and a fork PR runs code its author wrote, which must
# never reach the owner's machine. Never add a pull_request_target trigger here.
# test/architecture/ci.test.ts checks both. The self-hosted runners are Docker containers
# (ops/runner/, `bun run runner:up`); see docs/guides/how-to-setup-ci.md#self-hosted-runners.

jobs:
  lint:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the attribution check can read the PR's commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run lint
      # No AI agent as author or co-author in the PR's commits (AGENTS.md rule 9).
      - name: No agent attribution
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-attribution.ts "origin/$BASE_REF"

  typecheck:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # All workspaces (astro check for apps) and the setup scripts.
      - run: bun run typecheck

  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Vitest. Includes the MCP parity rule: a tRPC procedure or HTTP endpoint without
      # an MCP tool or exemption fails.
      - run: bun run test

  migrations:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Migrations must match the Drizzle schema: generating again changes nothing.
      - name: Migrations are in sync with the schema
        run: |
          bun run db:generate
          git status --porcelain packages/features/migrations
          test -z "$(git status --porcelain packages/features/migrations)"

      # The migrations apply cleanly to an empty D1 (local, no account needed).
      # checkout cleans ignored files, so apps/web/.wrangler starts empty on a
      # self-hosted runner too.
      - name: Migrations apply to an empty local D1
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars && bun run db:migrate:local

  # Storybook stories as tests in real Chromium (Vitest browser mode): every story renders,
  # passes axe (a violation fails the job) and runs its play function.
  components:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Chromium for the pinned Playwright; its Ubuntu packages too, unless the runner image
      # already has them (scripts/ci-playwright-install.ts).
      - run: bun scripts/ci-playwright-install.ts
      # ci-reap stops dev servers the run leaves behind, which would keep the step open.
      - run: bun scripts/ci-reap.ts bun run test:components

  # Playwright journeys against `astro dev` with local bindings and a migrated local D1.
  # No Cloudflare account: D1, R2, queues and email are Miniflare's local implementations.
  e2e:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-playwright-install.ts
      # checkout cleans ignored files, so .dev.vars and the local D1 start fresh on a
      # self-hosted runner too.
      - name: Local env and database
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars && bun run db:migrate:local
      - name: Journeys
        # Playwright starts and stops the dev server (webServer in playwright.config.ts);
        # ci-reap stops a workerd or astro it leaves behind, which would keep the step open.
        timeout-minutes: 10
        run: bun scripts/ci-reap.ts bun run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  build:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Web app and Storybook production builds.
      - run: bun run build

  # Builds and packages the web Worker for each environment without deploying: catches
  # broken wrangler.jsonc entries, missing bindings and bundling errors. Needs no
  # Cloudflare account; the token below only stops Wrangler from asking to log in.
  deploy-dry-run:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [develop, staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Dry-run deploy (${{ matrix.environment }})
        working-directory: apps/web
        env:
          # develop is the top level of wrangler.jsonc, so it has no CLOUDFLARE_ENV.
          CLOUDFLARE_ENV: ${{ matrix.environment != 'develop' && matrix.environment || '' }}
          CLOUDFLARE_API_TOKEN: dry-run-no-account
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
        run: bun run deploy:dry-run
