name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner choice (every job): the repository variable CI_RUNS_ON, as JSON, e.g.
#   gh variable set CI_RUNS_ON --body '["self-hosted","cloudflare-starter"]'
# Unset means "ubuntu-latest". Pull requests from forks ALWAYS run on GitHub-hosted
# runners: the repository is public and a fork PR runs code its author wrote, which must
# never reach the owner's machine. See docs/how-to-setup-ci.md.

jobs:
  lint:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # All workspaces (astro check for apps) and the setup scripts.
      - run: bun run typecheck

  test:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Vitest. Includes the MCP parity rule: a tRPC procedure or HTTP endpoint without
      # an MCP tool or exemption fails.
      - run: bun run test

  migrations:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Migrations must match the Drizzle schema: generating again changes nothing.
      - name: Migrations are in sync with the schema
        run: |
          bun run db:generate
          git status --porcelain packages/features/migrations
          test -z "$(git status --porcelain packages/features/migrations)"

      # The migrations apply cleanly to an empty D1 (local, no account needed).
      # checkout cleans ignored files, so apps/web/.wrangler starts empty on a
      # self-hosted runner too.
      - name: Migrations apply to an empty local D1
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars && bun run db:migrate:local

  build:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest') || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Web app and Storybook production builds.
      - run: bun run build
