name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Typecheck (incl. scripts), Biome, Vitest. The tests include the MCP parity
      # rule: a tRPC procedure or HTTP endpoint without an MCP tool or exemption fails.
      - run: bun run verify

      # Migrations must match the Drizzle schema: generating again changes nothing.
      - name: Migrations are in sync with the schema
        run: |
          bun run db:generate
          git status --porcelain packages/features/migrations
          test -z "$(git status --porcelain packages/features/migrations)"

      # The migrations apply cleanly to an empty D1 (local, no account needed).
      - name: Migrations apply
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars && bun run db:migrate:local

      - run: bun run build
