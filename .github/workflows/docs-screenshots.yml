name: Docs screenshots

# Regenerates the docs screenshots (`bun run docs:screenshots`: the demo seed on a fresh
# local database, then every shot in apps/web/test/screens/shots.ts, dark and light) and
# opens a pull request with the new images and manifest. By hand only (Actions → Docs
# screenshots → Run workflow), on a GitHub-hosted runner, with local bindings: nothing
# reaches a Cloudflare account. docs/guides/how-to-publish-docs-and-landing.md#screenshots
on:
  workflow_dispatch:
    inputs:
      shots:
        description: Only these shot ids, comma separated (empty for all)
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-screenshots
  cancel-in-progress: false

jobs:
  capture:
    name: Capture and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-playwright-install.ts
      - name: Local env and database
        run: cp apps/web/.dev.vars.example apps/web/.dev.vars && bun run db:migrate:local
      - name: Capture
        timeout-minutes: 20
        env:
          SHOTS: ${{ inputs.shots }}
        run: bun scripts/ci-reap.ts bun run docs:screenshots
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain docs/images/screens)" ]; then
            echo "The screenshots did not change."
            exit 0
          fi
          branch="docs/screenshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/images/screens
          git commit -m "Regenerate the docs screenshots"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Regenerate the docs screenshots" \
            --body "Captured by the Docs screenshots workflow ($RUN_URL) with \`bun run docs:screenshots\` on a fresh local database. Check the images, then merge."
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots-report
          path: apps/web/test-results
          retention-days: 7
